<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thiết bị - Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #bd2130;
        }
        .btn-warning {
            background-color: #ffc107;
            color: #212529;
        }
        .btn-warning:hover {
            background-color: #e0a800;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #f8f9fa;
            margin-bottom: 8px;
            padding: 10px;
            border-left: 4px solid #007bff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hidden {
            display: none !important;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- KHUNG ĐĂNG NHẬP -->
    <div id="login-section">
        <h2>Đăng nhập Admin</h2>
        <div class="form-group">
            <label>Tài khoản:</label>
            <input type="text" id="username" placeholder="Nhập tài khoản (admin123)">
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu (@@@@@@)">
        </div>
        <button onclick="handleLogin()">Đăng nhập</button>
        <p id="error-msg" style="color: red; margin-top: 10px;"></p>
    </div>

    <!-- KHUNG QUẢN LÝ THIẾT BỊ (Ẩn khi chưa đăng nhập) -->
    <div id="admin-section" class="hidden">
        <div class="header-actions">
            <h2>Quản lý thiết bị</h2>
            <button class="btn-warning" onclick="handleLogout()">Đăng xuất</button>
        </div>

        <div class="form-group">
            <label>Tên thiết bị:</label>
            <input type="text" id="deviceName" placeholder="Nhập tên thiết bị mới...">
        </div>
        <button onclick="addDevice()">Thêm thiết bị</button>
        <button class="btn-danger" onclick="clearAllDevices()" style="margin-left: 5px;">Xoá toàn bộ thiết bị</button>

        <h3>Danh sách thiết bị:</h3>
        <ul id="deviceList"></ul>
    </div>
</div>

<script>
    // Kiểm tra trạng thái đăng nhập khi tải trang
    window.onload = function() {
        const isLoggedIn = localStorage.getItem("isAdminLoggedIn");
        if (isLoggedIn === "true") {
            showAdminPanel();
        }
    };

    // Xử lý đăng nhập
    function handleLogin() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        const errorMsg = document.getElementById("error-msg");

        if (user === "admin123" && pass === "@@@@@@") {
            localStorage.setItem("isAdminLoggedIn", "true");
            errorMsg.innerText = "";
            showAdminPanel();
        } else {
            errorMsg.innerText = "Sai tài khoản hoặc mật khẩu!";
        }
    }

    // Hiển thị giao diện quản lý
    function showAdminPanel() {
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("admin-section").classList.remove("hidden");
        loadDevices();
    }

    // Xử lý đăng xuất
    function handleLogout() {
        localStorage.removeItem("isAdminLoggedIn");
        document.getElementById("admin-section").classList.add("hidden");
        document.getElementById("login-section").classList.remove("hidden");
        // Xóa sạch giá trị ô input đăng nhập
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
    }

    // Tải danh sách thiết bị từ localStorage (Lưu vĩnh viễn)
    function loadDevices() {
        const deviceList = document.getElementById("deviceList");
        deviceList.innerHTML = "";
        
        let devices = JSON.parse(localStorage.getItem("devices")) || [];
        
        devices.forEach((device, index) => {
            const li = document.createElement("li");
            li.innerHTML = `<span>${device}</span> <button class="btn-danger" onclick="deleteDevice(${index})" style="padding: 5px 10px; font-size: 12px;">Xoá</button>`;
            deviceList.appendChild(li);
        });
    }

    // Thêm thiết bị mới
    function addDevice() {
        const deviceNameInput = document.getElementById("deviceName");
        const deviceName = deviceNameInput.value.trim();

        if (deviceName === "") {
            alert("Vui lòng nhập tên thiết bị!");
            return;
        }

        let devices = JSON.parse(localStorage.getItem("devices")) || [];
        devices.push(deviceName);
        localStorage.setItem("devices", JSON.stringify(devices));

        deviceNameInput.value = "";
        loadDevices();
    }

    // Xoá 1 thiết bị
    function deleteDevice(index) {
        let devices = JSON.parse(localStorage.getItem("devices")) || [];
        devices.splice(index, 1);
        localStorage.setItem("devices", JSON.stringify(devices));
        loadDevices();
    }

    // Xoá toàn bộ thiết bị
    function clearAllDevices() {
        if (confirm("Bạn có chắc chắn muốn xoá toàn bộ danh sách thiết bị không?")) {
            localStorage.removeItem("devices");
            loadDevices();
        }
    }
</script>

</body>
</html>
